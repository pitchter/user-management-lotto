version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dupl
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wastedassign
    - whitespace

  settings:
    depguard:
      rules:
        # The core rule of the hexagonal architecture: the core must not know
        # about frameworks or drivers.
        core-stays-pure:
          files:
            - "**/internal/domain/**"
            - "**/internal/app/**"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: "domain/app must not depend on an HTTP framework; use DTOs and let the adapter convert"
            - pkg: go.mongodb.org/mongo-driver
              desc: "domain/app must not know about MongoDB; go through the domain.UserRepository port"
            - pkg: github.com/golang-jwt/jwt
              desc: "domain/app must not know how tokens are signed; go through the domain.TokenService port"
            - pkg: google.golang.org/grpc
              desc: "domain/app must not depend on gRPC"
        # The domain is the innermost layer and may not depend on anything outside.
        domain-is-innermost:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: user-management-api/internal/adapter
              desc: "the domain is the innermost layer and must not import adapters"
            - pkg: user-management-api/internal/app
              desc: "the domain must not import the application layer"
            - pkg: user-management-api/internal/platform
              desc: "the domain must not import platform packages"

    errcheck:
      check-type-assertions: true

    gosec:
      excludes:
        - G104 # overlaps with errcheck

    govet:
      enable:
        - shadow

    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
        - name: context-as-argument
        - name: error-strings
        - name: error-return
        - name: indent-error-flow
        - name: unexported-return
        - name: var-naming

    dupl:
      threshold: 180

  exclusions:
    rules:
      # Test files: relax the rules that do not improve test quality.
      - path: _test\.go
        linters:
          - dupl
          - gosec
          - errcheck
          - noctx
      # Redeclaring err inside an if block is idiomatic in tests and reads
      # better than inventing a new name each time; keep the rule for real code.
      - path: _test\.go
        linters:
          - govet
        text: "^shadow:"
      # Code generated by protoc does not need linting.
      - path: \.pb\.go
        linters:
          - all

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - user-management-api

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
