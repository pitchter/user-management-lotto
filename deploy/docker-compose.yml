# docker compose: bring the whole system up with one command.
#
# Usage: make docker-up  (or docker compose -f deploy/docker-compose.yml up --build)
name: user-management-api

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      # Exposed so mongosh or Compass can connect from the host during development.
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Makes the api container wait until MongoDB really answers a ping,
      # not merely until the process started, which would have the api dial
      # a database that is not ready.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${VERSION:-docker}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${GRPC_PORT:-50051}:50051"
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_PORT: 8080
      GRPC_PORT: 50051
      # A compose service name doubles as its hostname.
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-user_management}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env first (generate one with make secret)}
      JWT_ISSUER: ${JWT_ISSUER:-user-management-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-user-management-client}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      USER_COUNT_INTERVAL: ${USER_COUNT_INTERVAL:-10s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    # Keep only the capabilities the container actually needs.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mongo-data:
